name: Image plugin build and source contracts

on:
  push:
    branches:
      - fix/skindesigner-grid-20261125
  pull_request:
  workflow_dispatch:

jobs:
  native-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config vdr-dev \
            libavcodec-dev libavformat-dev libswscale-dev libexif-dev

      - name: Source contracts
        run: python3 -m unittest discover -s tests -v

      - name: Build native image plugin (no Skindesigner required)
        run: make -j2 WITH_SKINDESIGNER=0 libvdr-image_next.so

      - name: Verify built plugin exists
        run: test -s libvdr-image_next.so
